services:
  api:
    build: .
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/app/dataset
      - ./tmp:/app/tmp
  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./dataset:/app/dataset
      - ./tmp:/app/tmp
    depends_on:
      - api
